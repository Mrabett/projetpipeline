name: SmartPark CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # Déclenche le pipeline à chaque push sur main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Build & Push Backend
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartpark-backend:latest

      # 2. Build & Push Frontend
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartpark-frontend:latest

  deploy-to-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Kubeconfig
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Deploy Manifests
        run: |
          # On applique les fichiers dans l'ordre logique
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/01-configmap.yaml
          kubectl apply -f k8s/02-secret.yaml
          kubectl apply -f k8s/03-mongodb.yaml
          kubectl apply -f k8s/04-backend.yaml
          kubectl apply -f k8s/05-frontend.yaml
          kubectl apply -f k8s/06-hpa.yaml

      - name: Force Rollout
        run: |
          # Force Kubernetes à télécharger la nouvelle image 'latest'
          kubectl rollout restart deployment smartpark-backend -n smartpark
          kubectl rollout restart deployment smartpark-frontend -n smartpark