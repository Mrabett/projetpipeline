name: SmartPark CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # Job 1: Build & Push Backend
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests -f backend/pom.xml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          # Utilisation du SHA du commit pour un tag unique (plus sûr que latest)
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smartpark-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smartpark-backend:${{ github.sha }}

  # Job 2: Build & Push Frontend (s'exécute en parallèle du backend !)
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Angular
        run: |
          cd frontend
          npm install
          npm run build --prod

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smartpark-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smartpark-frontend:${{ github.sha }}

  # Job 3: Déploiement (attend la fin des deux builds)
  deploy-to-k8s:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Kubeconfig
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Deploy Manifests
        run: |
          kubectl apply -f k8s/

      - name: Force Rollout & Wait
        run: |
          kubectl rollout restart deployment smartpark-backend -n smartpark
          kubectl rollout restart deployment smartpark-frontend -n smartpark
          # Vérifie que le déploiement réussit réellement
          kubectl rollout status deployment/smartpark-backend -n smartpark --timeout=90s
          kubectl rollout status deployment/smartpark-frontend -n smartpark --timeout=90s